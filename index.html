<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合艾旅行行程 Dashboard</title>
<meta name="description" content="10/8–10/11 合艾 Hat Yai 四日行程：按摩、美食、咖啡、夜市。手機旅遊 Dashboard：現在在哪、下一站去哪、幾點出發。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F262B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-180.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="合艾行程">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script>
/* apply saved theme before first paint to avoid a flash */
try{ const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; }catch(e){}
</script>
<style>
/* ---------- tokens (shared with sydney-travel) ---------- */
:root{
  --paper:#EDEFEA;
  --surface:#F8F9F6;
  --surface-2:#E3E7E0;
  --ink:#0F262B;
  --ink-2:#3D5257;
  --ink-3:#6B7F83;
  --rule:#CBD2CB;
  --rule-soft:#DDE2DB;
  --jade:#04624B;
  --jade-soft:#DCE9E2;
  --gold:#B07D08;
  --gold-soft:#F0E4C6;
  --dusk:#5B4A8A;
  --dusk-soft:#E2DDEE;
  --alert:#B3261E;
  --alert-soft:#F6DDDA;
  --shadow:0 1px 2px rgba(15,38,43,.06), 0 8px 24px -14px rgba(15,38,43,.22);

  --f-display:"Noto Serif TC", "Songti TC", serif;
  --f-body:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --f-label:"IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;

  --maxw:720px;
  --tabbar:calc(60px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1518; --surface:#102126; --surface-2:#182F34;
    --ink:#E6ECE8; --ink-2:#AFC0C0; --ink-3:#7C9295;
    --rule:#254045; --rule-soft:#1B3238;
    --jade:#4FC3A1; --jade-soft:#123830;
    --gold:#E7B23F; --gold-soft:#3A2E10;
    --dusk:#A794E0; --dusk-soft:#2A2444;
    --alert:#F08C84; --alert-soft:#3D1A17;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0A1518; --surface:#102126; --surface-2:#182F34;
  --ink:#E6ECE8; --ink-2:#AFC0C0; --ink-3:#7C9295;
  --rule:#254045; --rule-soft:#1B3238;
  --jade:#4FC3A1; --jade-soft:#123830;
  --gold:#E7B23F; --gold-soft:#3A2E10;
  --dusk:#A794E0; --dusk-soft:#2A2444;
  --alert:#F08C84; --alert-soft:#3D1A17;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; padding-bottom:var(--tabbar);
}
h1,h2,h3{font-family:var(--f-display); font-weight:900; text-wrap:balance; margin:0; line-height:1.2}
h2{font-size:1.25rem}
h3{font-size:1rem; font-weight:600}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--jade); outline-offset:3px; border-radius:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.label{
  font-family:var(--f-label); font-size:.6875rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3);
}
.wrap{max-width:var(--maxw); margin:0 auto; padding-inline:16px}
.hide{display:none !important}

/* ---------- sticky top bar: clocks ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);
}
.topbar .wrap{display:flex; align-items:center; gap:12px; padding-block:8px; min-height:52px}
.brand{display:flex; flex-direction:column; min-width:0; line-height:1.15}
.brand .t{font-family:var(--f-display); font-weight:900; font-size:1.05rem; white-space:nowrap}
.brand .s{font-family:var(--f-label); font-size:.62rem; font-weight:600; letter-spacing:.12em; color:var(--jade); text-transform:uppercase}
.clocks{margin-left:auto; display:flex; gap:10px}
.clock{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.clock .c{font-family:var(--f-label); font-size:.6rem; font-weight:600; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase}
.clock .v{font-family:var(--f-mono); font-size:1.05rem; font-weight:600; font-variant-numeric:tabular-nums}
.clock.th .c{color:var(--jade)}
.clock.my .v{color:var(--ink-2)}
.theme-btn{
  font-family:var(--f-label); font-size:.72rem; font-weight:600; letter-spacing:.04em;
  color:var(--ink-2); background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  padding:4px 8px; cursor:pointer; white-space:nowrap; flex:none;
}

/* ---------- tab bar (bottom, thumb reach) ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom);
}
.tabbar ul{list-style:none; margin:0 auto; padding:0; max-width:var(--maxw); display:grid; grid-template-columns:repeat(7,1fr)}
.tabbar button{
  width:100%; height:60px; border:0; background:transparent; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink-3); font-size:.62rem; font-family:var(--f-label); font-weight:600; letter-spacing:.02em;
  border-top:2px solid transparent; margin-top:-1px;
}
.tabbar button .i{font-size:1.2rem; line-height:1}
.tabbar button.on{color:var(--jade); border-top-color:var(--jade)}

/* ---------- panels ---------- */
.panel{display:none; padding-block:16px 32px}
.panel.on{display:block}
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:6px;
  box-shadow:var(--shadow); padding:14px 16px; margin-top:12px; min-width:0;
}
.card.flat{box-shadow:none}
.card-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:22px 0 2px}
.sec-h:first-child{margin-top:4px}
.muted{color:var(--ink-3); font-size:.82rem}
.small{font-size:.84rem; color:var(--ink-2)}

/* ---------- alerts strip ---------- */
.alerts{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.alerts li{
  font-size:.84rem; padding:7px 11px; border-radius:4px; line-height:1.45;
  background:var(--alert-soft); color:var(--ink); border-left:3px solid var(--alert);
}
.alerts li b{font-family:var(--f-mono); font-weight:600}
.alerts-toggle{
  margin-top:8px; background:transparent; border:0; color:var(--ink-3); font-size:.78rem; cursor:pointer; padding:0;
  font-family:var(--f-label); font-weight:600; letter-spacing:.06em;
}

/* ---------- hero (today) ---------- */
.hero{
  margin-top:12px; border-radius:8px; border:1px solid var(--rule); box-shadow:var(--shadow);
  background:
    radial-gradient(700px 240px at 90% -40%, var(--jade-soft), transparent 70%),
    var(--surface);
  padding:16px 16px 14px;
}
.hero-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.hero-date{font-family:var(--f-mono); font-size:1.15rem; font-weight:600}
.hero-dow{color:var(--ink-3)}
.hero-title{font-family:var(--f-display); font-weight:600; font-size:1rem; margin-top:2px; color:var(--ink-2)}
.hero-now{font-family:var(--f-mono); font-size:clamp(2.6rem, 14vw, 3.6rem); font-weight:600; letter-spacing:-.02em; line-height:1; margin-top:10px; font-variant-numeric:tabular-nums}
.hero-now small{font-size:.38em; color:var(--ink-3); font-weight:500; letter-spacing:0; margin-left:6px}
.hero-my{font-family:var(--f-mono); font-size:.85rem; color:var(--ink-3); margin-top:4px}
.hero-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.hbox{border:1px solid var(--rule-soft); border-radius:6px; padding:10px 12px; background:var(--paper); min-width:0}
.hbox .label{display:block; margin-bottom:4px}
.hbox .big{font-family:var(--f-mono); font-size:1.35rem; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums}
.hbox .t{font-weight:700; font-size:.95rem; line-height:1.3; margin-top:2px; overflow-wrap:anywhere}
.hbox .m{font-size:.78rem; color:var(--ink-3); margin-top:3px; line-height:1.4}
.hbox.now{border-color:var(--jade); background:linear-gradient(135deg, var(--jade-soft), var(--paper) 80%)}
.hbox.now .label{color:var(--jade)}
.hbox.next .big{color:var(--gold)}
.hbox.leave{grid-column:1 / -1; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-color:var(--gold); background:linear-gradient(90deg, var(--gold-soft), var(--paper) 70%)}
.hbox.leave .big{font-size:1.5rem}
.hbox.leave .label{color:var(--gold); margin:0}
.hbox.leave .m{margin:0; flex:1 1 160px}
.hero-foot{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.pill{
  display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  font-size:.78rem; font-family:var(--f-mono); color:var(--jade);
  border:1px solid var(--rule); border-radius:3px; padding:3px 9px; background:var(--surface); cursor:pointer;
}
.pill:hover{border-color:var(--jade); background:var(--jade-soft)}
.pill.ghost{color:var(--ink-2)}

/* ---------- day picker ---------- */
.daypick{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px}
.daypick button{
  border:1px solid var(--rule); background:var(--surface); border-radius:5px; padding:7px 4px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.2;
}
.daypick .d{font-family:var(--f-mono); font-weight:600; font-size:.95rem}
.daypick .w{font-size:.7rem; color:var(--ink-3)}
.daypick .k{font-family:var(--f-label); font-size:.58rem; font-weight:600; letter-spacing:.06em; padding:0 5px; border-radius:2px; margin-top:2px}
.daypick button.on{border-color:var(--jade); box-shadow:0 0 0 1px var(--jade)}
.daypick button.today .d{color:var(--jade)}
.k.work{background:var(--gold-soft); color:var(--gold)}
.k.off{background:var(--jade-soft); color:var(--jade)}
.k.fly{background:var(--surface-2); color:var(--ink-3)}

/* ---------- timeline ---------- */
.tl{list-style:none; margin:4px 0 0; padding:0}
.tl-day{margin-top:18px}
.tl-dayhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 0 8px; border-bottom:1px solid var(--rule)}
.tl-dayhead .d{font-family:var(--f-mono); font-weight:600; font-size:1.1rem}
.tl-dayhead .w{color:var(--ink-3); font-size:.85rem}
.tl-dayhead .t{font-family:var(--f-display); font-weight:600; font-size:.98rem; min-width:0; flex:1 1 180px}
.tl-dayhead .wx{margin-left:auto; font-family:var(--f-mono); font-size:.76rem; color:var(--ink-2); white-space:nowrap}
.tl-dayhead .wx:empty{display:none}
.tl-foot{margin-top:10px; padding:9px 12px; border-radius:5px; background:var(--surface-2); font-size:.82rem; color:var(--ink-2)}
.tl-foot .label{margin-right:6px}

.it{display:grid; grid-template-columns:54px 1fr; gap:0 10px; position:relative; padding:11px 0}
.it + .it{border-top:1px solid var(--rule-soft)}
.it-time{font-family:var(--f-mono); font-size:.86rem; font-weight:600; line-height:1.3; padding-top:3px; font-variant-numeric:tabular-nums}
.it-time .to{display:block; font-weight:400; font-size:.74rem; color:var(--ink-3)}
.it-body{min-width:0; border-left:2px solid var(--rule-soft); padding-left:12px; overflow-wrap:anywhere}
.it.c-train .it-body{border-left-color:var(--ink-3); border-left-style:dashed}
.it.c-home .it-body{border-left-color:var(--ink-3)}
.it.c-work .it-body{border-left-color:var(--gold)}
.it.c-massage .it-body,.it.c-coffee .it-body,.it.c-sight .it-body,.it.c-food .it-body,.it.c-shop .it-body{border-left-color:var(--jade)}
.it.c-night .it-body,.it.c-bar .it-body{border-left-color:var(--dusk)}
.it-title{font-weight:700; font-size:.98rem; line-height:1.35; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.it-title .ic{font-size:1.05rem; line-height:1}
.it-title .st{
  font-family:var(--f-label); font-size:.6rem; font-weight:600; letter-spacing:.1em; padding:1px 6px; border-radius:2px;
}
.it.now .it-title .st{background:var(--jade); color:var(--surface); animation:livepulse 2.2s ease-in-out infinite}
.it.next .it-title .st{border:1px solid var(--jade); color:var(--jade)}
.it.done{opacity:.55}
.it.now .it-body{background:linear-gradient(90deg, var(--jade-soft), transparent 80%); border-radius:0 4px 4px 0; margin-right:-4px; padding-right:4px}
.it-desc{color:var(--ink-2); font-size:.86rem; margin-top:3px; line-height:1.5}
.it-meta{display:flex; flex-wrap:wrap; gap:4px 8px; margin-top:6px; font-size:.75rem; color:var(--ink-3); font-family:var(--f-mono)}
.it-meta span{white-space:nowrap}
.it-meta .leave{color:var(--gold); font-weight:600}
.tips{list-style:none; margin:7px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:5px 6px}
.tips li{font-size:.74rem; color:var(--ink-2); font-family:var(--f-mono); border:1px solid var(--rule); border-radius:2px; padding:1px 7px; background:var(--paper)}
.tips li.warn{border-color:var(--alert); color:var(--alert)}
.maps{list-style:none; margin:7px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:5px 6px}
.maps a{display:inline-block; font-size:.76rem; font-family:var(--f-mono); text-decoration:none; color:var(--jade); border:1px solid var(--rule); border-radius:2px; padding:2px 8px; background:var(--paper)}
.maps a:hover{border-color:var(--jade); background:var(--jade-soft)}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- place cards (map tab) ---------- */
.place{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:start; padding:11px 0}
.place + .place{border-top:1px solid var(--rule-soft)}
.place .n{font-weight:700; font-size:.95rem; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.place .n .ic{font-size:1rem}
.place .a{font-size:.78rem; color:var(--ink-3); margin-top:2px; overflow-wrap:anywhere}
.place .h{font-size:.78rem; color:var(--ink-2); margin-top:3px}
.place .dist{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:5px; font-family:var(--f-mono); font-size:.74rem; color:var(--ink-2)}
.place .dist b{font-weight:600; color:var(--ink)}
.place .go{grid-column:1 / -1; display:flex; gap:6px; flex-wrap:wrap}
.place .tag{font-family:var(--f-label); font-size:.58rem; font-weight:600; letter-spacing:.08em; padding:1px 6px; border-radius:2px; background:var(--surface-2); color:var(--ink-3)}
.place .tag.v{background:var(--jade-soft); color:var(--jade)}
.place .tag.u{background:var(--gold-soft); color:var(--gold)}
.filter{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.filter button{
  border:1px solid var(--rule); background:var(--surface); border-radius:20px; padding:4px 11px; font-size:.78rem; cursor:pointer; color:var(--ink-2);
}
.filter button.on{border-color:var(--jade); color:var(--jade); background:var(--jade-soft)}

/* leaflet map */
.lmap{width:100%; height:min(62vh, 480px); border-radius:5px; border:1px solid var(--rule); background:var(--surface-2); margin-top:4px; z-index:0}
.lmap:empty{display:none}
.leaflet-container{font-family:var(--f-body)}
.leaflet-popup-content-wrapper{border-radius:6px; background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:10px 12px; font-size:.84rem; line-height:1.45}
.leaflet-popup-content b{font-size:.92rem}
.leaflet-popup-content .pp{font-family:var(--f-mono); font-size:.74rem; color:var(--ink-2); margin-top:3px}
.leaflet-popup-content a.pill{margin-top:7px}
.leaflet-control-attribution{font-size:.6rem}
:root[data-theme="dark"] .leaflet-tile, :root:not([data-theme="light"]) .leaflet-tile{filter:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile{filter:brightness(.85) contrast(1.05)} }
:root[data-theme="dark"] .leaflet-tile{filter:brightness(.85) contrast(1.05)}
.lmk{width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25)}

/* schematic map */
.schem{width:100%; aspect-ratio:1 / 1.05; display:block; margin-top:4px}
.schem .bg{fill:var(--paper)}
.schem .ring{fill:none; stroke:var(--rule); stroke-dasharray:3 4}
.schem .ringl{font:500 9px var(--f-mono); fill:var(--ink-3)}
.schem .dot{fill:var(--jade)}
.schem .dot.n{fill:var(--dusk)}
.schem .dot.h{fill:var(--gold)}
.schem .dot.t{fill:var(--ink-3)}
.schem .pl{font:500 10px var(--f-body); fill:var(--ink)}
.schem .home{fill:var(--alert)}
.schem a{cursor:pointer}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:.86rem; margin-top:8px}
th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
th{font-family:var(--f-label); font-size:.64rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
td.m,th.m{font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
td.r,th.r{text-align:right}
tr.hl td{background:var(--jade-soft); font-weight:600}
tr.dim td{color:var(--ink-3)}
tr.sum td{border-top:2px solid var(--rule); font-weight:700}

/* ---------- budget / converter ---------- */
.conv{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-top:8px}
.conv input{
  width:100%; font:600 1.2rem var(--f-mono); padding:8px 10px; border:1px solid var(--rule); border-radius:5px;
  background:var(--paper); color:var(--ink); min-width:0;
}
.conv .eq{font-family:var(--f-mono); color:var(--ink-3); text-align:center}
.conv .out{font:600 1.2rem var(--f-mono); padding:8px 10px; border:1px dashed var(--rule); border-radius:5px; background:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seg-btn{display:inline-flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden}
.seg-btn button{border:0; background:var(--surface); padding:4px 10px; font-size:.78rem; cursor:pointer; color:var(--ink-2)}
.seg-btn button.on{background:var(--jade); color:var(--surface)}
.spend-row{display:grid; grid-template-columns:1fr 92px auto; gap:6px; margin-top:8px}
.spend-row input,.spend-row select{font:inherit; font-size:.9rem; padding:7px 9px; border:1px solid var(--rule); border-radius:5px; background:var(--paper); color:var(--ink); min-width:0}
.spend-row button{border:1px solid var(--jade); background:var(--jade); color:var(--surface); border-radius:5px; padding:0 12px; cursor:pointer; font-weight:600}
.spend-list{list-style:none; margin:8px 0 0; padding:0}
.spend-list li{display:flex; gap:8px; align-items:baseline; padding:5px 0; border-top:1px solid var(--rule-soft); font-size:.86rem}
.spend-list li .d{color:var(--ink-3); font-family:var(--f-mono); font-size:.74rem}
.spend-list li .v{margin-left:auto; font-family:var(--f-mono); font-weight:600}
.spend-list li button{border:0; background:transparent; color:var(--ink-3); cursor:pointer; padding:0 4px}
.spend-total{display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:2px solid var(--rule); font-weight:700}

/* ---------- info / checklist ---------- */
.kv{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:.86rem; margin-top:6px}
.kv dt{color:var(--ink-3); white-space:nowrap}
.kv dd{margin:0; overflow-wrap:anywhere}
.kv a{color:var(--jade)}
.addr{font-family:var(--f-mono); font-size:.9rem; line-height:1.5; margin-top:4px; overflow-wrap:anywhere}
.check{list-style:none; margin:6px 0 0; padding:0}
.check li{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--rule-soft); font-size:.88rem}
.check li:first-child{border-top:0}
.check input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--jade); flex:none}
.check li.done label{text-decoration:line-through; color:var(--ink-3)}
.check label{flex:1; cursor:pointer}
.note-list{margin:6px 0 0; padding-left:18px; font-size:.86rem; color:var(--ink-2)}
.note-list li{margin-top:4px}
.src{font-size:.72rem; color:var(--ink-3); margin-top:8px; line-height:1.5}
.src a{color:var(--ink-3)}
.tzrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px}
.tzrow .hbox .big{font-size:1.3rem}
.timeline-mini{display:flex; flex-direction:column; gap:0; margin-top:6px}
.tm{display:grid; grid-template-columns:62px 1fr; gap:10px; padding:7px 0; border-top:1px solid var(--rule-soft); font-size:.86rem}
.tm:first-child{border-top:0}
.tm .t{font-family:var(--f-mono); font-weight:600; font-size:.84rem}
.tm .t small{display:block; color:var(--ink-3); font-weight:400; font-size:.7rem}
.tm .x{color:var(--ink-2)}
.tm.hl .t{color:var(--jade)}

.colophon{margin-top:28px; font-size:.74rem; color:var(--ink-3); line-height:1.6}

@media (min-width:600px){
  .tabbar button{font-size:.72rem}
  .hero-grid{grid-template-columns:1fr 1fr 1fr}
  .hbox.leave{grid-column:1 / -1}
}
@media (prefers-reduced-motion: reduce){
  .it.now .it-title .st{animation:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="s">Hat Yai · 10/8 – 10/11</span>
      <span class="t">合艾行程 Dashboard</span>
    </div>
    <div class="clocks" aria-label="現在時間">
      <div class="clock th"><span class="c">泰國 TH</span><span class="v" id="clk-th">--:--</span></div>
      <div class="clock my"><span class="c">馬來西亞 MY</span><span class="v" id="clk-my">--:--</span></div>
    </div>
    <button id="theme-btn" class="theme-btn" type="button" aria-label="切換深淺色模式">🌓</button>
  </div>
</header>

<main class="wrap">
  <!-- ===== 今日 ===== -->
  <section class="panel on" id="p-today" aria-label="今日">
    <div id="hero" class="hero"></div>
    <div id="today-tl"></div>
    <ul class="alerts" id="alerts"></ul>
  </section>

  <!-- ===== 完整行程 ===== -->
  <section class="panel" id="p-plan" aria-label="完整行程">
    <div class="daypick" id="daypick"></div>
    <div id="plan"></div>
  </section>

  <!-- ===== 地圖 ===== -->
  <section class="panel" id="p-map" aria-label="地圖">
    <div class="card">
      <div class="card-h"><h2>以 Airbnb 為中心</h2><span class="muted">距離 ＝ 道路距離 (估)</span></div>
      <div id="lmap" class="lmap" aria-label="地圖"></div>
      <svg id="schem" class="schem hide" viewBox="0 0 360 380" role="img" aria-label="各地點相對 Airbnb 的位置示意圖"></svg>
      <p class="muted" id="map-note">紅點為 Airbnb，虛線圈為 1 km / 3 km。點標記可開 Google Maps。</p>
    </div>
    <div class="filter" id="map-filter"></div>
    <div class="card" id="places"></div>
    <p class="src">距離與時間以 Airbnb (39 Supasarnrungsan Soi 2) 為基準，道路距離由 OSRM 估算；Grab 時間含等車與市區車流，實際依時段浮動。</p>
  </section>

  <!-- ===== 交通 ===== -->
  <section class="panel" id="p-transit" aria-label="交通"></section>

  <!-- ===== 美食 ===== -->
  <section class="panel" id="p-food" aria-label="餐廳美食"></section>

  <!-- ===== 預算 ===== -->
  <section class="panel" id="p-budget" aria-label="預算"></section>

  <!-- ===== 重要資訊 ===== -->
  <section class="panel" id="p-info" aria-label="重要資訊"></section>

  <p class="colophon" id="colophon"></p>
</main>

<nav class="tabbar" aria-label="主要頁面">
  <ul>
    <li><button data-tab="today" class="on"><span class="i">📍</span>今日</button></li>
    <li><button data-tab="plan"><span class="i">🗓️</span>行程</button></li>
    <li><button data-tab="map"><span class="i">🗺️</span>地圖</button></li>
    <li><button data-tab="transit"><span class="i">🚆</span>交通</button></li>
    <li><button data-tab="food"><span class="i">🍜</span>美食</button></li>
    <li><button data-tab="budget"><span class="i">💰</span>預算</button></li>
    <li><button data-tab="info"><span class="i">ℹ️</span>資訊</button></li>
  </ul>
</nav>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
